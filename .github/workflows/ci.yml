name: Viper CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
      - 'support/**'

  push:
    branches:
      - main
      - 'release/**'
      - 'support/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore Viper.sln

      - name: Build solution
        run: >
          dotnet build
          Viper.sln
          --configuration Release
          --no-restore

      - name: Run serialization tests
        run: >
          dotnet test
          tests/ViShap.Viper.Serialization.Tests/ViShap.Viper.Serialization.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=serialization-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            **/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14