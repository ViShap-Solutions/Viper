name: Publish Viper Ecosystem to NuGet
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract Version from Tag
        run: |
          TAG_NAME=${{ github.ref_name }}
          VERSION=${TAG_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Restore Dependencies
        run: dotnet restore Viper.sln

      - name: Build Solution
        run: dotnet build Viper.sln --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test Viper.sln --configuration Release --no-build

      - name: Pack All NuGet Packages
        run: |
          dotnet pack src/ViShap.Viper.Core/ViShap.Viper.Core.csproj --configuration Release --no-build /p:Version=${{ env.VERSION }} --output ./artifacts
          dotnet pack src/ViShap.Viper.Serialization/ViShap.Viper.Serialization.csproj --configuration Release --no-build /p:Version=${{ env.VERSION }} --output ./artifacts
          dotnet pack src/ViShap.Viper/ViShap.Viper.csproj --configuration Release --no-build /p:Version=${{ env.VERSION }} --output ./artifacts

      - name: Push Packages to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://nuget.org --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
